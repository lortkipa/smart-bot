# Dev dependencies only. Apps run on the host with hot reload (see `pnpm dev`).
name: smart-bot-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartbot}
      POSTGRES_DB: ${POSTGRES_DB:-smartbot}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54320}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:

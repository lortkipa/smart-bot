# Production stack: Postgres + API server (also serves the built web app) + agent worker.
# Run from the repo root: `pnpm prod:up` (wraps `docker compose -f deploy/compose.yml --env-file .env up`).
name: smart-bot

x-db-url: &db-url postgres://${POSTGRES_USER:-smartbot}:${POSTGRES_PASSWORD:-smartbot}@postgres:5432/${POSTGRES_DB:-smartbot}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartbot}
      POSTGRES_DB: ${POSTGRES_DB:-smartbot}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    restart: unless-stopped
    environment:
      DATABASE_URL: *db-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "${PROD_PORT:-8080}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: *db-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      server:
        condition: service_healthy # server applies migrations first

volumes:
  pgdata:
